[project]
name = "face-pipeline"
version = "0.1.0"
description = "Face recognition pipeline for a Lightroom Classic photo library"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "insightface>=0.7.3",
    "tqdm>=4.66",
]
# onnxruntime (CPU) or onnxruntime-gpu is installed separately by the
# Dockerfile that matches the target machine (see docker/Dockerfile.gpu /
# docker/Dockerfile.cpu) since the two packages are mutually exclusive.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
face-pipeline = "face_pipeline.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["face_pipeline*"]
